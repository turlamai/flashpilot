name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve main Product Acceptance; cancel only superseded PR revisions.
  group: acceptance-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable
      - name: Install local package and pinned Rivet
        shell: pwsh
        run: |
          raco pkg install --auto --name flashpilot --link racket
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c"
      - name: Run executable acceptance contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .rivet\acceptance | Out-Null
          $report = & raco rivet acceptance --json
          $status = $LASTEXITCODE
          $report | Tee-Object -FilePath .rivet\acceptance\report.json
          exit $status
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashpilot-acceptance-windows
          path: .rivet/acceptance
          if-no-files-found: warn

  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: stable
      - name: Install local package and pinned Rivet
        run: |
          raco pkg install --auto --name flashpilot --link racket
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c"
      - name: Run executable acceptance contract
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          raco rivet acceptance --json | tee .rivet/acceptance/report.json
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashpilot-acceptance-macos-${{ matrix.arch }}
          path: .rivet/acceptance
          if-no-files-found: warn

  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c
      - name: Install native dependencies, local package, and pinned Rivet
        run: |
          set -euo pipefail
          # Hosted Ubuntu runners sometimes point apt at an unresponsive Azure mirror.
          # Use the official HTTPS archive and bound network waits so a mirror outage
          # cannot consume the entire native acceptance timeout.
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$sources"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes at-spi2-core dbus-x11 cmake ninja-build pkg-config \
            libgtk-4-dev libsecret-1-dev liblz4-dev zlib1g-dev libncurses-dev \
            python3-pyatspi weston
          raco pkg install --auto --name flashpilot --link racket
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c"
      - name: Run executable acceptance contract
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          dbus-run-session -- bash -c \
            'set -euo pipefail; raco rivet acceptance --json | tee .rivet/acceptance/report.json'
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashpilot-acceptance-linux
          path: .rivet/acceptance
          if-no-files-found: warn
