name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep every main/tag quality gate; cancel only superseded PR revisions.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            racket-arch: x64
          - os: windows-latest
            racket-arch: x64
          - os: macos-latest
            racket-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Release version gate (VERSION == CHANGELOG == rivet.rktd == info.rkt == backend == CLI)
        shell: bash
        run: bash scripts/check-release-version.sh
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install package
        run: raco pkg install --auto --name flashpilot --link racket
      - name: Install Rivet (pinned to the acceptance engine version)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#b9811930fcda0893cf5de40a41f4a25d539b958e'
      - name: Compile Rivet backend
        run: raco make app/backend.rkt
      - name: Compile CLI
        run: raco make app/cli.rkt
      - name: Compile MCP server
        run: raco make app/mcp.rkt
      - name: Test (UDS/ISO-TP/flash plans/DTC/providers)
        run: raco test racket/flashpilot
      - name: Offline signed CLI update trust tests (no release secrets)
        run: raco test tests/update-policy-test.rkt
      - name: CLI identity contract tests (--version, exit codes)
        run: raco test tests/cli-test.rkt
      - name: Sign five synthetic CLI archives and reject wrong trust key
        run: raco test tests/sign-cli-update-manifest-test.rkt
      - name: Compile signed CLI manifest publisher
        run: raco make scripts/sign-cli-update-manifest.rkt
      - name: Compile offline updater policy
        run: raco make app/update-policy.rkt
      - name: Smoke the CLI (simulated ECU, hardware-free)
        shell: bash
        run: |
          racket app/cli.rkt verify examples/plan.sim.json
          racket app/cli.rkt flash examples/plan.sim.json
          racket app/cli.rkt validate examples/plan.sim.json
          racket app/cli.rkt flash examples/plan.sim-fd.json
          racket app/cli.rkt flash examples/plan.sim.json --transport lin
          racket scripts/mcp-smoke.rkt

  portable-windows-archive:
    name: Windows extracted CLI ZIP contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install CLI engine
        run: raco pkg install --auto --name flashpilot --link racket
      - name: Build the same portable CLI staging used by release
        shell: bash
        run: bash scripts/build-cli-distribution.sh
      - name: Archive with the release ZIP procedure
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath flashpilot-ci-windows-x64.zip
      - name: Extract away from checkout and exercise the bundled runtime
        shell: pwsh
        run: '& scripts/windows-cli-archive-smoke.ps1 -Archive flashpilot-ci-windows-x64.zip'
