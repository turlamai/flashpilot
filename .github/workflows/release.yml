name: release

# Tag-triggered CLI release: one zip + .sha256 per platform/arch plus a
# combined SHA256SUMS, published as the Latest GitHub Release. The GUI shells
# are a debug cockpit, not a release artifact — CLI only, honestly.

on:
  push:
    tags: ['v*']

# attest-build-provenance signs the published subjects with the runner's
# OIDC identity, so the release job needs the token and attestation write
# scopes on top of contents (payback pattern).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Version must be single-sourced (tag = rktd = info.rkt)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${VERSION}\]" CHANGELOG.md
          grep -q "(version . \"${VERSION}\")" rivet.rktd
          grep -q "(define version \"${VERSION}\")" racket/info.rkt

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            racket-arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            racket-arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            racket-arch: arm64
          - os: macos-latest
            platform: macos
            arch: arm64
            racket-arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
            racket-arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket (full CS distribution)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS

      - name: Install package
        run: raco pkg install --auto --name flashpilot --link racket

      - name: Compile CLI
        run: raco make app/cli.rkt

      - name: Build and bundle CLI (shared with extracted archive CI)
        shell: bash
        run: bash scripts/build-cli-distribution.sh

      - name: Smoke the bundled binary (simulated ECU, hardware-free)
        shell: bash
        run: |
          EXE=stage/bin/flashpilot
          [ '${{ runner.os }}' = 'Windows' ] && EXE=stage/bin/flashpilot.exe
          "$EXE" --help
          "$EXE" verify examples/plan.sim.json
          "$EXE" flash examples/plan.sim.json
          # the archive carries examples/ — it must be in the staged copy
          test -f stage/examples/plan.sim.json
          # exit codes never lie: a bogus command must exit 2
          set +e
          "$EXE" bogus >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 2

      - name: Package (zip)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="flashpilot-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          (cd stage && zip -r "../${ASSET}.zip" .)
          ls -la "${ASSET}.zip"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $asset = "flashpilot-$version-windows-x64"
          Compress-Archive -Path stage/* -DestinationPath "$asset.zip"

      - name: Exercise extracted Windows archive (actual published layout)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          & scripts/windows-cli-archive-smoke.ps1 -Archive "flashpilot-$version-windows-x64.zip"

      - name: Checksum
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="flashpilot-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          sha256sum "${ASSET}.zip" > "${ASSET}.zip.sha256"
          cat "${ASSET}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            flashpilot-*.zip
            flashpilot-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate and stage five canonical platform archives
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          mkdir -p public
          for suffix in linux-arm64 linux-x64 macos-arm64 macos-x64 windows-x64; do
            name="flashpilot-$VERSION-$suffix.zip"
            test -s "artifacts/$name" || { echo "::error::Missing $name"; exit 1; }
            cp "artifacts/$name" "public/$name"
          done
          (cd public && sha256sum flashpilot-*.zip | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum --check SHA256SUMS)
          test "$(grep -c '^' public/SHA256SUMS)" -eq 5
      - name: Build release body (changelog section + checksums)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # heading looks like "## [0.1.0] - 2026-10-14"; match the bracketed prefix
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "See CHANGELOG.md for details." > release-body.md
          fi
          {
            echo ""
            echo "Standalone CLI archives — no Racket installation required. Run \`bin/flashpilot\` on Unix/macOS or \`bin/flashpilot.exe\` on Windows. Racket's platform-specific runtime library placement is preserved."
            echo ""
            echo "Updates are manual: download the new archive and replace your installation; no in-app updater is bundled."
            echo ""
            echo "### Checksums (SHA-256)"
            echo '```'
            cat public/SHA256SUMS
            echo '```'
          } >> release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/flashpilot-*.zip
            public/SHA256SUMS
          body_path: release-body.md
          generate_release_notes: true

      - name: Prune stale release assets on retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
              fi
            done

      # Public provenance for everything the release publishes: the five
      # CLI archives plus the signed update manifest (payback pattern).
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*
